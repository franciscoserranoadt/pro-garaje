plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'es.progaraje.app'
    compileSdk 34

    defaultConfig {
        applicationId 'es.progaraje.app'
        minSdk 23
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Firma fija: NO cambiar nunca, o las actualizaciones dejarán de instalarse encima.
    signingConfigs {
        release {
            storeFile file('pro-garaje.jks')
            storePassword 'progaraje2026'
            keyAlias 'progaraje'
            keyPassword 'progaraje2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
